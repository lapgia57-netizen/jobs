name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Giải pháp: Tự động tải cài đặt Gradle hệ thống và tạo file gradlew nếu thiếu
      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Không tìm thấy gradlew. Đang tự động cài đặt gradle-cli để khởi tạo wrapper..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # Tìm và quét tất cả các file APK được sinh ra để upload
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JobFinder-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
