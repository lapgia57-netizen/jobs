name: Build JobFinder APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout source code
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Setup Java
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ============================================================
      # 3. Kiểm tra Java / project
      # ============================================================
      - name: Check environment
        shell: bash
        run: |
          echo "===== JAVA ====="
          java -version

          echo ""
          echo "===== PROJECT ====="
          pwd
          ls -la

      # ============================================================
      # 4. Sửa xung đột Repository & Khởi tạo Gradle Wrapper
      # ============================================================
      - name: Ensure Gradle Wrapper exists
        shell: bash
        run: |
          echo "Dọn dẹp tạm thời các khối repositories xung đột trong build.gradle..."
          
          # Xóa các dòng chứa google() hoặc mavenCentral() gây lỗi cấu hình trùng lặp
          if [ -f "build.gradle" ]; then
            sed -i '/google()/d' build.gradle
            sed -i '/mavenCentral()/d' build.gradle
          fi

          if [ -f "build.gradle.kts" ]; then
            sed -i '/google()/d' build.gradle.kts
            sed -i '/mavenCentral()/d' build.gradle.kts
          fi

          # Tiến hành kiểm tra và tạo Wrapper độc lập
          if [ -f "./gradlew" ]; then
            echo "Gradle Wrapper found. Making it executable..."
            chmod +x ./gradlew
          else
            echo "Gradle Wrapper not found. Generating wrapper 8.4..."
            gradle wrapper --gradle-version 8.4
            chmod +x ./gradlew
          fi

      # ============================================================
      # 5. Build Android App (Assemble APK)
      # ============================================================
      - name: Build with Gradle
        shell: bash
        run: ./gradlew assembleDebug

      # ============================================================
      # 6. Upload APK Artifact
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jobfinder-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
