name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Giải pháp mới: Cài đặt trực tiếp phiên bản Gradle hệ thống thay vì dùng wrapper
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5' # Bạn có thể đổi sang '8.10' hoặc phiên bản phù hợp dự án của bạn

      # Không cần chmod +x gradlew nữa vì chúng ta dùng lệnh hệ thống trực tiếp
      - name: Build debug APK
        run: gradle assembleDebug

      # Quét và upload tất cả file APK được tạo ra
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JobFinder-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
