name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Sửa lỗi: Tự động di chuyển vào thư mục chứa gradlew trước khi cấp quyền và build
      - name: Grant execute permission for gradlew
        run: |
          GRADLEW_DIR=$(find . -name gradlew -exec dirname {} \;)
          if [ -z "$GRADLEW_DIR" ]; then
            echo "Error: Không tìm thấy file gradlew trong dự án. Hãy chắc chắn bạn đã commit file này lên Git."
            exit 1
          fi
          echo "Tìm thấy gradlew tại thư mục: $GRADLEW_DIR"
          cd $GRADLEW_DIR
          chmod +x gradlew

      # Sửa lỗi: Chạy lệnh build đúng tại thư mục chứa file gradlew đó
      - name: Build debug APK
        run: |
          GRADLEW_DIR=$(find . -name gradlew -exec dirname {} \;)
          cd $GRADLEW_DIR
          ./gradlew assembleDebug

      # Sửa lỗi: Quét tìm file APK ở mọi thư mục con để upload
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JobFinder-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
