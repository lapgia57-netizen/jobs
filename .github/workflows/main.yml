name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # Tối ưu: Bật cache mặc định của setup-java cho gradle
          cache: 'gradle'

      # Tối ưu: Sử dụng action setup-gradle chính thức giúp tối ưu hóa cấu hình & tăng tốc độ build
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        # Tối ưu: Bỏ --stacktrace khi không cần thiết để log sạch hơn và build nhanh hơn một chút
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JobFinder-debug-apk
          # Tối ưu: Dùng dấu * để đảm bảo tìm đúng file APK ngay cả khi cấu hình build thay đổi tên file
          path: app/build/outputs/apk/debug/*.apk
