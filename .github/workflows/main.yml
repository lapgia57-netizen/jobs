name: Build JobFinder APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout source code
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Setup Java
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ============================================================
      # 3. Kiểm tra Java / project
      # ============================================================
      - name: Check environment
        shell: bash
        run: |
          echo "===== JAVA ====="
          java -version

          echo ""
          echo "===== PROJECT ====="
          pwd
          ls -la

      # ============================================================
      # 4. Tạo Gradle Wrapper an toàn
      # ============================================================
      - name: Ensure Gradle Wrapper exists
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            echo "Gradle Wrapper found. Making it executable..."
            chmod +x ./gradlew
          else
            echo "Gradle Wrapper not found. Generating wrapper 8.4..."
            # Sử dụng cờ -D để tạm thời ép Gradle chấp nhận repository khai báo ở build.gradle
            gradle wrapper --gradle-version 8.4 -Dorg.gradle.dependency.resolutionmanagement.control=project
            chmod +x ./gradlew
          fi

      # ============================================================
      # 5. Build Android App (Assemble APK)
      # ============================================================
      - name: Build with Gradle
        shell: bash
        # Thêm cờ tương tự khi build nếu Gradle 8.4 vẫn siết chặt cấu hình
        run: ./gradlew assembleDebug -Dorg.gradle.dependency.resolutionmanagement.control=project

      # ============================================================
      # 6. Upload APK Artifact
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jobfinder-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
