name: Build JobFinder APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout source code
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Setup Java
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          # Chỉ định đúng thư mục chứa Gradle để cache hoạt động
          cache-dependency-path: JobFinderApp/gradle/wrapper/gradle-wrapper.properties

      # ============================================================
      # 3. Cấp quyền và chạy Gradle Wrapper (Trỏ đúng vào JobFinderApp)
      # ============================================================
      - name: Grant execute permission for gradlew
        shell: bash
        run: |
          cd JobFinderApp
          if [ -f "./gradlew" ]; then
            echo "Tìm thấy gradlew, tiến hành cấp quyền..."
            chmod +x ./gradlew
          else
            echo "Không tìm thấy gradlew gốc, tự động tạo wrapper mới..."
            gradle wrapper --gradle-version 8.4
            chmod +x ./gradlew
          fi

      # ============================================================
      # 4. Sửa xung đột Repository & Build ứng dụng Android
      # ============================================================
      - name: Build with Gradle
        shell: bash
        run: |
          cd JobFinderApp
          
          echo "Xóa bỏ các dòng repositories trùng lặp gây lỗi cấu hình..."
          if [ -f "build.gradle" ]; then
            sed -i '/google()/d' build.gradle
            sed -i '/mavenCentral()/d' build.gradle
          fi
          
          echo "Bắt đầu build APK ở chế độ Debug..."
          ./gradlew assembleDebug

      # ============================================================
      # 5. Xuất và Lưu trữ file APK kết quả
      # ============================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobfinder-debug-apk
          # Đường dẫn chính xác trỏ vào thư mục build của JobFinderApp
          path: JobFinderApp/app/build/outputs/apk/debug/*.apk
          retention-days: 7
