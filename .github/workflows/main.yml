name: Build JobFinder APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout source code
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Setup Java (Nâng cấp lên v5, bỏ qua check cache properties sớm)
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. Kiểm tra Java / project
      # ============================================================
      - name: Check environment
        shell: bash
        run: |
          echo "===== JAVA ====="
          java -version

          echo ""
          echo "===== PROJECT ====="
          pwd
          ls -la

      # ============================================================
      # 4. Khởi tạo Gradle Wrapper độc lập trong thư mục JobFinderApp
      # ============================================================
      - name: Ensure Gradle Wrapper exists
        shell: bash
        run: |
          cd JobFinderApp
          if [ -f "./gradlew" ]; then
            echo "Tìm thấy gradlew, tiến hành cấp quyền thực thi..."
            chmod +x ./gradlew
          else
            echo "Không tìm thấy gradlew, tự động tạo wrapper phiên bản 8.4..."
            gradle wrapper --gradle-version 8.4
            chmod +x ./gradlew
          fi

      # ============================================================
      # 5. Sửa xung đột Repository & Build ứng dụng Android
      # ============================================================
      - name: Build with Gradle
        shell: bash
        run: |
          cd JobFinderApp
          
          echo "Dọn dẹp các khối repositories trùng lặp trong build.gradle..."
          if [ -f "build.gradle" ]; then
            sed -i '/google()/d' build.gradle
            sed -i '/mavenCentral()/d' build.gradle
          fi
          
          echo "Bắt đầu build file APK..."
          ./gradlew assembleDebug

      # ============================================================
      # 6. Xuất và Lưu trữ file APK kết quả
      # ============================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobfinder-debug-apk
          path: JobFinderApp/app/build/outputs/apk/debug/*.apk
          retention-days: 7
