name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. Setup Gradle
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ==========================================
      # 4. Detect Gradle project
      # ==========================================
      - name: Check project
        shell: bash
        run: |
          set -e

          echo "================================="
          echo "PROJECT STRUCTURE"
          echo "================================="

          pwd
          ls -la

          echo ""
          echo "Gradle files:"
          find . -maxdepth 3 -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print

      # ==========================================
      # 5. Fix repository conflict automatically
      # ==========================================
      - name: Fix Gradle repository configuration
        shell: bash
        run: |
          set -e

          echo "================================="
          echo "FIXING GRADLE REPOSITORIES"
          echo "================================="

          if [ -f "settings.gradle" ]; then

            echo "Found settings.gradle"

            # Nếu đã có dependencyResolutionManagement,
            # thay PREFER_SETTINGS thành FAIL_ON_PROJECT_REPOS
            # để project repositories không gây conflict.
            sed -i \
              's/RepositoriesMode\.PREFER_SETTINGS/RepositoriesMode.FAIL_ON_PROJECT_REPOS/g' \
              settings.gradle

          fi

          if [ -f "settings.gradle.kts" ]; then

            echo "Found settings.gradle.kts"

            sed -i \
              's/RepositoriesMode\.PREFER_SETTINGS/RepositoriesMode.FAIL_ON_PROJECT_REPOS/g' \
              settings.gradle.kts

          fi

          echo ""
          echo "Checking repository configuration..."

          if [ -f "settings.gradle" ]; then
            grep -n -E \
              "dependencyResolutionManagement|repositoriesMode|google|mavenCentral" \
              settings.gradle || true
          fi

          if [ -f "settings.gradle.kts" ]; then
            grep -n -E \
              "dependencyResolutionManagement|repositoriesMode|google|mavenCentral" \
              settings.gradle.kts || true
          fi

      # ==========================================
      # 6. Find Gradle Wrapper
      # ==========================================
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            echo "Gradle Wrapper found."
            chmod +x ./gradlew
          else
            echo "No Gradle Wrapper found."
            echo "Using installed Gradle."
          fi

      # ==========================================
      # 7. Show Gradle version
      # ==========================================
      - name: Gradle version
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew --version
          else
            gradle --version
          fi

      # ==========================================
      # 8. Clean
      # ==========================================
      - name: Clean project
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew clean --no-daemon
          else
            gradle clean --no-daemon
          fi

      # ==========================================
      # 9. Build Debug APK
      # ==========================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          echo "================================="
          echo "BUILDING APK"
          echo "================================="

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace
          else
            gradle assembleDebug \
              --no-daemon \
              --stacktrace
          fi

      # ==========================================
      # 10. Find APK
      # ==========================================
      - name: Locate APK
        shell: bash
        run: |
          echo "================================="
          echo "GENERATED APK FILES"
          echo "================================="

          find . \
            -type f \
            -name "*.apk" \
            -print

      # ==========================================
      # 11. Upload APK
      # ==========================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JobFinder-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
