name: Build JobFinder APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout source code
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Setup Java
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ============================================================
      # 3. Kiểm tra Java / project
      # ============================================================
      - name: Check environment
        shell: bash
        run: |
          echo "===== JAVA ====="
          java -version

          echo ""
          echo "===== PROJECT ====="
          pwd
          ls -la

      # ============================================================
      # 4. Build Android App (Sử dụng trực tiếp Gradle hệ thống)
      # Bước này đã thay đổi: dùng 'gradle' thay vì './gradlew'
      # ============================================================
      - name: Build with Gradle
        shell: bash
        run: |
          echo "Dọn dẹp các khối repositories trùng lặp trong build.gradle để tránh lỗi cấu hình..."
          if [ -f "build.gradle" ]; then
            sed -i '/google()/d' build.gradle
            sed -i '/mavenCentral()/d' build.gradle
          fi
          
          echo "Bắt đầu build APK..."
          gradle assembleDebug --warning-mode none

      # ============================================================
      # 5. Upload APK Artifact
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jobfinder-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
