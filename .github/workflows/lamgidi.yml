name: Build JobFinder APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      # ============================================================
      # 1. Checkout source code
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Setup Java
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # ============================================================
      # 3. Kiểm tra môi trường & cấu trúc thư mục thực tế
      # ============================================================
      - name: Check environment
        shell: bash
        run: |
          echo "===== JAVA ====="
          java -version
          echo ""
          echo "===== PROJECT ROOT ====="
          pwd
          ls -la

      # ============================================================
      # 4. Khởi tạo hoặc cấp quyền Gradle Wrapper
      # ============================================================
      - name: Ensure Gradle Wrapper exists
        shell: bash
        run: |
          # Kiểm tra xem gradlew nằm ở gốc hay trong JobFinderApp
          TARGET_DIR="."
          if [ -d "JobFinderApp" ]; then
            TARGET_DIR="JobFinderApp"
          fi
          
          cd "$TARGET_DIR"
          if [ -f "./gradlew" ]; then
            echo "Tìm thấy gradlew tại $TARGET_DIR, tiến hành cấp quyền thực thi..."
            chmod +x ./gradlew
          else
            echo "Không tìm thấy gradlew, tự động tạo wrapper phiên bản 8.4..."
            gradle wrapper --gradle-version 8.4
            chmod +x ./gradlew
          fi

      # ============================================================
      # 5. Build ứng dụng Android
      # ============================================================
      - name: Build with Gradle
        shell: bash
        run: |
          TARGET_DIR="."
          if [ -d "JobFinderApp" ]; then
            TARGET_DIR="JobFinderApp"
          fi
          
          cd "$TARGET_DIR"
          echo "Bắt đầu build file APK tại thư mục: $(pwd)"
          ./gradlew assembleDebug

      # ============================================================
      # 6. Xuất và Lưu trữ file APK kết quả
      # ============================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobfinder-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          retention-days: 7
