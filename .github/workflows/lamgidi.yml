name: Build JobFinder APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      # ============================================================
      # 1. Lấy mã nguồn từ Repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Cài đặt môi trường Java
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          # Tự động cache gradle để các lần build sau nhanh hơn
          cache: 'gradle'

      # ============================================================
      # 3. Khởi tạo / Cấp quyền Gradle Wrapper và Build APK
      # ============================================================
      - name: Build with Gradle
        shell: bash
        run: |
          # 1. Tự động xác định thư mục chứa code Android
          if [ -d "JobFinderApp" ] && [ -f "JobFinderApp/build.gradle" ] || [ -f "JobFinderApp/build.gradle.kts" ]; then
            WORKING_DIR="JobFinderApp"
          else
            WORKING_DIR="."
          fi
          
          echo "--> Thư mục làm việc được xác định là: $WORKING_DIR"
          cd "$WORKING_DIR"
          
          # 2. Đảm bảo file gradlew có quyền thực thi hoặc tự tạo nếu thiếu
          if [ -f "./gradlew" ]; then
            echo "--> Tìm thấy gradlew, tiến hành cấp quyền thực thi..."
            chmod +x ./gradlew
          else
            echo "--> Không tìm thấy gradlew, tiến hành tạo Gradle Wrapper mới..."
            gradle wrapper --gradle-version 8.4
            chmod +x ./gradlew
          fi
          
          # 3. Chạy lệnh Build APK giải lập (Debug)
          echo "--> Bắt đầu quá trình build file APK..."
          ./gradlew assembleDebug

      # ============================================================
      # 4. Xuất và tải file APK về máy
      # ============================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobfinder-debug-apk
          # Sử dụng dấu ** giúp GitHub tự tìm file APK ở mọi ngóc ngách dự án
          path: '**/build/outputs/apk/debug/*.apk'
          retention-days: 7
