name: Build JobFinder APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      # ============================================================
      # 1. Tải mã nguồn từ GitHub Repository về máy ảo
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Cấu hình môi trường Java (Hỗ trợ code hoàn toàn bằng Java)
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle' # Tự động tăng tốc độ build bằng cách lưu cache

      # ============================================================
      # 3. Tự động tìm kiếm thư mục dự án và tiến hành Build APK
      # ============================================================
      - name: Auto-Detect Path and Build with Gradle
        shell: bash
        run: |
          echo "=====[ 1. TỰ ĐỘNG DÒ TÌM THƯ MỤC CHỨA CODE ]====="
          # Tìm kiếm file build.gradle gần nhất để định vị thư mục gốc Android
          GRADLE_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          
          if [ -z "$GRADLE_FILE" ]; then
            echo "❌ LỖI: Không tìm thấy bất kỳ file cấu hình build.gradle nào trong toàn bộ dự án!"
            exit 1
          fi
          
          # Lấy ra đường dẫn thư mục chứa file gradle đó
          TARGET_DIR=$(dirname "$GRADLE_FILE")
          echo "➡️ Đã phát hiện thư mục chứa mã nguồn Android tại: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          echo "=====[ 2. KHỞI TẠO HOẶC CẤP QUYỀN GRADLE WRAPPER ]====="
          if [ -f "./gradlew" ]; then
            echo "-> Tìm thấy gradlew tại chỗ, cấp quyền thực thi..."
            chmod +x ./gradlew
          else
            echo "-> Không thấy file gradlew có sẵn, tiến hành tự tạo mới Wrapper (v8.4)..."
            gradle wrapper --gradle-version 8.4
            chmod +x ./gradlew
          fi
          
          echo "=====[ 3. TIẾN HÀNH BIÊN DỊCH FILE APK ]====="
          ./gradlew assembleDebug

      # ============================================================
      # 4. Xuất và đóng gói file APK để tải về máy mẫu
      # ============================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobfinder-debug-apk
          # Sử dụng cấu trúc wildcard (**) để GitHub Actions tự động tìm mọi file .apk 
          # được sinh ra tại bất cứ phân vùng thư mục build nào mà không sợ sai đường dẫn.
          path: '**/build/outputs/apk/debug/*.apk'
          retention-days: 7
